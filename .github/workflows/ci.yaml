name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

# Toolchain matrix: coraza v3.8.1 needs Go >= 1.25, which forces TinyGo >= 0.39
# (0.34 bundles Go 1.23). 0.40.1 is the highest TinyGo that both boots this
# plugin and is verified by coraza upstream; see README for the details.
env:
  GO_VERSION: '1.25.14'
  TINYGO_VERSION: 0.39.0
  # TinyGo's wasi-legacy build mode post-processes with wasm-opt.
  BINARYEN_VERSION: version_133
  # Run e2e tests against the latest release and latest dev
  ENVOY_IMAGES: >
    envoyproxy/envoy:v1.33-latest
    envoyproxy/envoy-dev:latest

jobs:
  build:
    name: "Build (multiphase evaluation: ${{ matrix.multiphase_eval }})"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      fail-fast: false # ftw runs are flaky, let's keep the two jobs running reducing re-runs
      matrix:
        multiphase_eval: ["true","false"]
    env:
      MULTIPHASE_EVAL: ${{ matrix.multiphase_eval }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install TinyGo
        run: |
          gh release download v${TINYGO_VERSION} -p '*.linux-amd64.tar.gz' -D ~ -R github.com/tinygo-org/tinygo
          tar -xf ~/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz  -C $HOME
          echo "$HOME/tinygo/bin" >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install binaryen (wasm-opt)
        run: |
          curl -sSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          echo "/tmp/binaryen-${BINARYEN_VERSION}/bin" >> $GITHUB_PATH

      - name: Cache TinyGo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tinygo
          key: ${{ runner.os }}-tinygo-${{ env.TINYGO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-tinygo-${{ env.TINYGO_VERSION }}-

      - name: Run code checks
        run: go run mage.go lint

      - name: Build WASM filter
        run: go run mage.go build

      - name: Run unit tests
        run: go run mage.go coverage

      - name: Run e2e tests
        shell: bash
        run: >
          for image in $ENVOY_IMAGES; do
              echo "Running e2e with Envoy image $image"
              ENVOY_IMAGE=$image go run mage.go e2e
          done

      - name: Run regression tests (ftw)
        run: go run mage.go ftw

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ftw-envoy-logs-multiphase-${{ matrix.multiphase_eval }}
          path: build/ftw-envoy.log
